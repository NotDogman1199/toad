name: Build Toad-only plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source code only (skips the 3 GB romfs folder)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
          sparse-checkout-cone-mode: true

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cargo-skyline
        run: cargo install cargo-skyline --version 3.5.0 --locked

      - name: Download skyline stdlib (without the rate-limited GitHub API)
        run: |
          # Same steps as "cargo skyline update-std", done by hand
          git clone -q --filter=tree:0 --no-checkout --single-branch --branch skyline https://github.com/skyline-rs/rust-src.git /tmp/rs-history
          NIGHTLY="nightly-$(TZ=UTC git -C /tmp/rs-history log --author=bors -1 --format=%ad --date=format-local:%Y-%m-%d)"
          echo "Base toolchain: $NIGHTLY"
          rustup toolchain add "$NIGHTLY" --profile minimal
          BASE="$(rustc +"$NIGHTLY" --print sysroot)"
          SKY="$HOME/.cargo/skyline/toolchain/skyline"
          rm -rf "$SKY"
          mkdir -p "$(dirname "$SKY")"
          cp -r "$BASE" "$SKY"
          rm -rf "$SKY/lib/rustlib/src"
          mkdir -p "$SKY/lib/rustlib/src"
          git clone -q --recurse-submodules --shallow-submodules --depth 1 --branch skyline https://github.com/skyline-rs/rust-src.git "$SKY/lib/rustlib/src/rust"
          rustup toolchain link skyline-v3 "$SKY"

      - name: Build plugin
        run: cargo skyline build --release --features="main_nro"

      - name: Rename output to plugin.nro
        run: |
          mkdir out
          cp "$(find target -path '*release*' -name 'libplugin.nro' | head -n 1)" out/plugin.nro

      - name: Upload plugin.nro
        uses: actions/upload-artifact@v4
        with:
          name: toad-only-plugin
          path: out/plugin.nro
          if-no-files-found: error
